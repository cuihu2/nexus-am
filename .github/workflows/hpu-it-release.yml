name: Publish HPU IT package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to rebuild and upload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hpu-it-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build, validate, and upload HPU IT package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      HPU_IT_MEM_BASE: "0x87000000"
      HPU_IT_MEM_LINES: "19201"

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            gh \
            python3

      - name: Build and validate Nexus-AM HPU images
        env:
          AM_HOME: ${{ github.workspace }}
          JOBS: "4"
        run: |
          tests/hpu-it/scripts/build_nexus_am.sh \
            "$GITHUB_WORKSPACE/tests/hpu-it/build"

      - name: Package 27 IT delivery cases
        run: |
          tests/hpu-it/scripts/package_release.sh \
            "$GITHUB_WORKSPACE/tests/hpu-it/build/images/latest" \
            "$GITHUB_WORKSPACE/tests/hpu-it/build/release"

      - name: Upload package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null
          gh release upload "$RELEASE_TAG" \
            tests/hpu-it/build/release/*.tar.gz \
            tests/hpu-it/build/release/*.tar.gz.sha256 \
            --clobber \
            --repo "$GH_REPO"
